name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build RSDKv4 iOS
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" -alltargets -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO COMPRESS_PNG_FILES=NO STRIP_PNG_TEXT=NO build SYMROOT="$PWD/build"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r RSDKv4-iOS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-IPA
          path: RSDKv4-iOS.ipa
